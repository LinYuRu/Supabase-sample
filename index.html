<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>永和慢跑 - 管理員後台測試</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .admin-box { max-width: 500px; margin: 50px auto; padding: 20px; border: 1px solid #ddd; border-radius: 10px; }
        #admin-panel { display: none; } /* 登入後才顯示 */
    </style>
</head>
<body class="bg-light">

    <div class="container">
        <div id="login-box" class="admin-box bg-white">
            <h3 class="text-center">管理員登入</h3>
            <div class="mb-3">
                <input type="email" id="email" class="form-control" placeholder="Email">
            </div>
            <div class="mb-3">
                <input type="password" id="password" class="form-control" placeholder="密碼">
            </div>
            <button onclick="login()" class="btn btn-primary w-100">登入</button>
            <div id="login-msg" class="mt-2 text-danger"></div>
        </div>

        <div id="admin-panel" class="admin-box bg-white">
            <h3 class="text-center">發佈新公告</h3>
            <p id="user-info" class="text-muted small text-center"></p>
            <div class="mb-3">
                <input type="text" id="post-title" class="form-control" placeholder="公告標題">
            </div>
            <div class="mb-3">
                <textarea id="post-content" class="form-control" rows="5" placeholder="內容 (支援 HTML)"></textarea>
            </div>
            <button onclick="createPost()" class="btn btn-success w-100">立即發佈</button>
            <button onclick="logout()" class="btn btn-outline-secondary w-100 mt-2">登出</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://awenxjiniepxbnbxdefl.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_-tvu7CWehM2faugobpRR7w_wVl0tL2g';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 1. 登入功能
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const { data, error } = await _supabase.auth.signInWithPassword({ email, password });

            if (error) {
                document.getElementById('login-msg').innerText = "登入失敗: " + error.message;
            } else {
                checkUser();
            }
        }

        // 2. 檢查使用者狀態並切換介面
        async function checkUser() {
            const { data: { user } } = await _supabase.auth.getUser();
            if (user) {
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                document.getElementById('user-info').innerText = "當前帳號: " + user.email;
            }
        }

        // 3. 新增文章 (測試 INSERT RLS)
        async function createPost() {
            const title = document.getElementById('post-title').value;
            const content = document.getElementById('post-content').value;

            const { data, error } = await _supabase
                .from('posts')
                .insert([{ title, content }]); // author_id 會由 DB 預設值自動填入 auth.uid()

            if (error) {
                alert("發佈失敗 (請檢查 RLS 規則): " + error.message);
            } else {
                alert("公告發佈成功！");
                location.reload();
            }
        }

        // 4. 登出
        async function logout() {
            await _supabase.auth.signOut();
            location.reload();
        }
// 1. 管理員登入邏輯
async function adminLogin(email, password) {
    const { data, error } = await _supabase.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (error) {
        console.error("登入失敗:", error.message);
    } else {
        console.log("管理員已登入:", data.user.email);
    }
}

// 2. 修改特定公告的內容 (只有當登入者的 Email 符合 RLS 規則時才會成功)
async function updatePostContent(postId, newContent) {
    const { data, error } = await _supabase
        .from('posts')
        .update({ content: newContent })
        .eq('id', postId); // 指定要修改的文章 ID

    if (error) {
        // 如果 Email 不符合 RLS 規則，這裡會回傳錯誤
        alert("修改失敗：您可能沒有管理員權限。內容：" + error.message);
    } else {
        alert("公告修改成功！");
    }
}
        // 初始化檢查
        checkUser();
    </script>
</body>
</html>
