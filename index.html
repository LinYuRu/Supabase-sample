<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>永和慢跑 - Supabase 分頁版</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<style>
    body { background-color: #f4f6f9; }

    /* ==========================================
       通用導覽方塊 (Nav-Box) 改版基礎樣式
       ========================================== */
    .nav-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px 10px;
        text-decoration: none;
        border-radius: 12px;
        border: 1px solid;
        transition: all 0.25s ease-in-out;
        height: 100%;
        position: relative;
        overflow: hidden;
    }
    .nav-box i {
        font-size: 2rem;
        margin-bottom: 8px;
        transition: transform 0.25s ease;
    }
    .nav-box span {
        font-size: 0.9rem;
        font-weight: 600;
    }
    /* 懸浮微動態效果 */
    .nav-box:hover {
        transform: translateY(-4px);
        box-shadow: 0 6px 12px rgba(0,0,0,0.08);
    }
    .nav-box:hover i {
        transform: scale(1.15);
    }

    /* 標題設定 */
    .section-title-life { color: #198754; font-weight: 700; }
    .section-title-affairs { color: #0d6efd; font-weight: 700; }


    /* ==========================================
       【自訂按鈕色彩系統】每個按鈕不同底色且不重複
       ========================================== */
    
    /* 1. 跑者廣場 (翡翠綠) */
    .btn-color-square { background-color: #f2faf6; border-color: #d1e7dd; color: #198754; }
    .btn-color-square span { color: #146c43; }
    .btn-color-square:hover { background-color: #e2f4ec; }

    /* 2. 永和馬拉松路跑賽專輯 (薄荷青) */
    .btn-color-album { background-color: #f0fdfa; border-color: #ccfbf1; color: #0d9488; }
    .btn-color-album span { color: #115e59; }
    .btn-color-album:hover { background-color: #e0f2fe; }

    /* 3. Instagram (保留官方粉紅) */
    .box-ig { background-color: #fff0f5; border-color: #fcdbe7; color: #e1306c; }
    .box-ig span { color: #a91b4b; }
    .box-ig:hover { background-color: #fde2ec; }

    /* 4. Facebook (保留官方經典藍) */
    .box-fb { background-color: #f0f4fc; border-color: #d2e0f9; color: #1877f2; }
    .box-fb span { color: #1154aa; }
    .box-fb:hover { background-color: #e2ebfa; }

    /* 5. 成立簡介 (珊瑚淡紅) */
    .btn-color-start { background-color: #fff5f5; border-color: #ffe3e3; color: #e03131; }
    .btn-color-start span { color: #c92a2a; }
    .btn-color-start:hover { background-color: #ffe8e8; }

    /* 6. 創會故事 (陽光暖橙) */
    .btn-color-story { background-color: #fff9db; border-color: #fff3bf; color: #f08c00; }
    .btn-color-story span { color: #e67e22; }
    .btn-color-story:hover { background-color: #fff0b6; }

    /* 7. 委員會章則 (沉穩商務藍) */
    .btn-color-rights { background-color: #edf2ff; border-color: #dbe4ff; color: #4263eb; }
    .btn-color-rights span { color: #364fc7; }
    .btn-color-rights:hover { background-color: #bac8ff; }

    /* 8. 獎勵辦法 (琥珀暖金) */
    .btn-color-rewards { background-color: #fff9f0; border-color: #ffecb5; color: #d94111; }
    .btn-color-rewards span { color: #b23b00; }
    .btn-color-rewards:hover { background-color: #fff3cd; }

    /* 9. 會員紀律 (丁香極淺紫) */
    .btn-color-discipline { background-color: #f8f0fc; border-color: #f3d9fa; color: #ae3ec9; }
    .btn-color-discipline span { color: #862e9c; }
    .btn-color-discipline:hover { background-color: #f3ccf3; }

    /* 10. 會員申請 (天空冰藍) */
    .btn-color-apply { background-color: #e3fafc; border-color: #c5f6fa; color: #0b7285; }
    .btn-color-apply span { color: #09677a; }
    .btn-color-apply:hover { background-color: #91e7f6; }

    /* 11. 固定團練 (森林青草綠) */
    .btn-color-schedule { background-color: #f4fce3; border-color: #e9fac8; color: #5c940d; }
    .btn-color-schedule span { color: #4b7a0b; }
    .btn-color-schedule:hover { background-color: #d8f5a2; }

    /* 12. 服務幹部資訊 (復古莫蘭迪灰綠) */
    .btn-color-contact { background-color: #f1f3f5; border-color: #e9ecef; color: #495057; }
    .btn-color-contact span { color: #343a40; }
    .btn-color-contact:hover { background-color: #dee2e6; }
</style>
<body class="p-5">
<div id="clubCarousel" class="carousel slide shadow mb-5" data-bs-ride="carousel">
  <div class="carousel-indicators">
    <button type="button" data-bs-target="#clubCarousel" data-bs-slide-to="0" class="active"></button>
    <button type="button" data-bs-target="#clubCarousel" data-bs-slide-to="1"></button>
    <button type="button" data-bs-target="#clubCarousel" data-bs-slide-to="2"></button>
  </div>

  <div class="carousel-inner rounded">
    <div class="carousel-item active">
      <img src="images/banner1.jpg" class="d-block w-100" alt="團練合照">
      <div class="carousel-caption d-none d-md-block">
        <h5>每週晨跑活動</h5>
        <p>歡迎新朋友一起加入綠寶石公園團練。</p>
      </div>
    </div>
    <div class="carousel-item">
      <img src="images/banner2.jpg" class="d-block w-100" alt="賽事參與">
      <div class="carousel-caption d-none d-md-block">
        <h5>馬拉松賽事</h5>
        <p>我們一起跑過各大大小小的城市馬拉松。</p>
      </div>
    </div>
  </div>

  <button class="carousel-control-prev" type="button" data-bs-target="#clubCarousel" data-bs-slide="prev">
    <span class="carousel-control-prev-icon"></span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#clubCarousel" data-bs-slide="next">
    <span class="carousel-control-next-icon"></span>
  </button>
</div>

<div class="container my-5" style="max-width: 1000px;">
    
    <div class="card shadow-sm mb-5 border-0 rounded-3 overflow-hidden" id="latest-announcements">
        <div class="card-header bg-white py-3 border-bottom border-light">
            <h5 class="text-dark mb-0 fw-bold border-start border-4 border-warning ps-2">
                <i class="bi bi-megaphone-fill text-warning me-2"></i>最新公告
            </h5>
        </div>
        <div class="card-body p-0">
            <div class="list-group list-group-flush" id="preview-list">
                <div class="p-4 text-center text-muted">
                    <div class="spinner-border spinner-border-sm text-secondary me-2" role="status"></div>
                    正在載入最新公告...
                </div>
            </div>
        </div>
    </div>
    <div class="card shadow-sm mb-4 border-0 rounded-3 p-4 bg-white">
        <h5 class="section-title-affairs border-start border-4 border-primary ps-2 mb-4">
            <i class="bi bi-briefcase-fill me-2"></i>社團會務
        </h5>
        <div class="row row-cols-2 row-cols-md-4 g-3">
            <div class="col">
                <a href="./resources/introduces.html#cat-start" class="nav-box btn-color-start">
                    <i class="bi bi-lightning-charge-fill"></i>
                    <span>成立簡介</span>
                </a>
            </div>
            <div class="col">
                <a href="./resources/introduces.html#cat-story" class="nav-box btn-color-story">
                    <i class="bi bi-balloon-heart-fill"></i>
                    <span>創會故事</span>
                </a>
            </div>
            <div class="col">
                <a href="./resources/introduces.html#cat-rights" class="nav-box btn-color-rights">
                    <i class="bi bi-journal-text"></i>
                    <span>委員會章則</span>
                </a>
            </div>
            <div class="col">
                <a href="./resources/introduces.html#cat-rewards" class="nav-box btn-color-rewards">
                    <i class="bi bi-award-fill"></i>
                    <span>獎勵辦法</span>
                </a>
            </div>
            <div class="col">
                <a href="./resources/introduces.html#cat-discipline" class="nav-box btn-color-discipline">
                    <i class="bi bi-shield-lock-fill"></i>
                    <span>會員紀律</span>
                </a>
            </div>
            <div class="col">
                <a href="./resources/introduces.html#cat-apply" class="nav-box btn-color-apply">
                    <i class="bi bi-person-plus-fill"></i>
                    <span>會員申請</span>
                </a>
            </div>
            <div class="col">
                <a href="./resources/introduces.html#cat-schedule" class="nav-box btn-color-schedule">
                    <i class="bi bi-calendar-check-fill"></i>
                    <span>固定團練</span>
                </a>
            </div>
            <div class="col">
                <a href="./resources/introduces.html#cat-contact" class="nav-box btn-color-contact">
                    <i class="bi bi-person-lines-fill"></i>
                    <span>服務幹部資訊</span>
                </a>
            </div>
        </div>
    </div>
    
    <div class="card shadow-sm mb-5 border-0 rounded-3 p-4 bg-white">
        <h5 class="section-title-life border-start border-4 border-success ps-2 mb-4">
            <i class="bi bi-heart-pulse-fill me-2"></i>跑友生活
        </h5>
        <div class="row row-cols-2 row-cols-md-4 g-3">
            <div class="col">
                <a href="http://www.taipeimarathon.org.tw/contest.aspx" class="nav-box btn-color-square">
                    <i class="bi bi-chat-square-text-fill"></i>
                    <span>跑者廣場</span>
                </a>
            </div>
            <div class="col">
                <a href="https://www.instagram.com/yonghe_running_club/" target="_blank" class="nav-box box-ig">
                    <i class="bi bi-instagram"></i>
                    <span>Instagram</span>
                </a>
            </div>
            <div class="col">
                <a href="https://www.facebook.com/groups/1438023606443591/" target="_blank" class="nav-box box-fb">
                    <i class="bi bi-facebook"></i>
                    <span>Facebook</span>
                </a>
            </div>
            <div class="col">
                <a href="http://www.taipeimarathon.org.tw/yhrc/marathon/%E6%B0%B8%E5%92%8C%E9%A6%AC%E6%8B%89%E6%9D%BEindex.htm" class="nav-box btn-color-album">
                    <i class="bi bi-trophy-fill"></i>
                    <span>永和馬拉松路跑賽專輯</span>
                </a>
            </div>
        </div>
    </div>

</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // 1. 初始化 Supabase
        const SUPABASE_URL = 'https://awenxjiniepxbnbxdefl.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_-tvu7CWehM2faugobpRR7w_wVl0tL2g';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 負責拉取 Supabase 公告資料的動態函式
    async function loadPreview() {
        try {
            const { data, error } = await _supabase
                .from('posts')
                .select('title, created_at')
                .order('created_at', { ascending: false })
                .limit(3);

            const list = document.getElementById('preview-list');
            if (data && data.length > 0) {
                list.innerHTML = data.map(post => `
                    <a href="resources/announcements.html" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-3 px-4 border-0 border-bottom">
                        <span class="fw-bold text-dark"><i class="bi bi-dot text-warning fs-4 align-middle"></i>${post.title}</span>
                        <small class="text-muted bg-light px-2 py-1 rounded-2">${new Date(post.created_at).toLocaleDateString()}</small>
                    </a>
                `).join('');
            } else {
                document.getElementById('preview-list').innerHTML = '<div class="p-4 text-center text-muted">目前暫無最新公告</div>';
            }
        } catch (e) {
            console.error("載入最新公告發生錯誤:", e);
        }
    }

    // 當 DOM 樹準備完畢後執行動態功能
    document.addEventListener('DOMContentLoaded', async function() {
        
        // 1. 執行並等待 Supabase 公告渲染完畢
        await loadPreview();

        // 2. 自動聚焦平滑滾動到最新公告
        const targetSection = document.getElementById('latest-announcements');
        if (targetSection) {
            setTimeout(() => {
                targetSection.scrollIntoView({
                    behavior: 'smooth',
                    block: 'center'
                });
            }, 250);
        }
    });
    </script>
</body>
</html>
