<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>永和慢跑 - Supabase 分頁版</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="p-5">
<div id="clubCarousel" class="carousel slide shadow mb-5" data-bs-ride="carousel">
  <div class="carousel-indicators">
    <button type="button" data-bs-target="#clubCarousel" data-bs-slide-to="0" class="active"></button>
    <button type="button" data-bs-target="#clubCarousel" data-bs-slide-to="1"></button>
    <button type="button" data-bs-target="#clubCarousel" data-bs-slide-to="2"></button>
  </div>

  <div class="carousel-inner rounded">
    <div class="carousel-item active">
      <img src="images/banner1.jpg" class="d-block w-100" alt="團練合照">
      <div class="carousel-caption d-none d-md-block">
        <h5>每週晨跑活動</h5>
        <p>歡迎新朋友一起加入綠寶石公園團練。</p>
      </div>
    </div>
    <div class="carousel-item">
      <img src="images/banner2.jpg" class="d-block w-100" alt="賽事參與">
      <div class="carousel-caption d-none d-md-block">
        <h5>馬拉松賽事</h5>
        <p>我們一起跑過各大大小小的城市馬拉松。</p>
      </div>
    </div>
  </div>

  <button class="carousel-control-prev" type="button" data-bs-target="#clubCarousel" data-bs-slide="prev">
    <span class="carousel-control-prev-icon"></span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#clubCarousel" data-bs-slide="next">
    <span class="carousel-control-next-icon"></span>
  </button>
</div>
    <div class="container">
        <h1>永和慢跑最新公告</h1>
        <hr>

        <ul class="nav nav-tabs" id="announcementTab" role="tablist">
            <li class="nav-item">
                <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#cat-general" type="button">一般公告</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#cat-event" type="button">活動訊息</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#cat-member" type="button">會員專區</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#cat-rules" type="button">規章制度</button>
            </li>
        </ul>

        <div class="tab-content p-3 border border-top-0 bg-white">
            <div class="tab-pane fade show active" id="cat-general">讀取中...</div>
            <div class="tab-pane fade" id="cat-event"></div>
            <div class="tab-pane fade" id="cat-member"></div>
            <div class="tab-pane fade" id="cat-rules"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // 1. 初始化 Supabase
        const SUPABASE_URL = 'https://awenxjiniepxbnbxdefl.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_-tvu7CWehM2faugobpRR7w_wVl0tL2g';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // 2. 定義讀取資料函式
        async function loadPosts() {
            const { data, error } = await _supabase
                .from('posts')
                .select('*')
                .order('created_at', { ascending: false });
            
            if (error) {
                console.error('抓取失敗:', error);
                return;
            }

            // 先清空所有容器
            const categories = ['general', 'event', 'member', 'rules'];
            categories.forEach(cat => {
                const el = document.getElementById(`cat-${cat}`);
                if (el) el.innerHTML = ''; 
            });

            // 分流渲染資料
            data.forEach(post => {
                // 注意：這裡的 post.category 必須對應資料庫欄位裡的值 (例如 'general')
                const container = document.getElementById(`cat-${post.category}`);
                if (container) {
                    container.innerHTML += `
                        <div class="card mb-3 shadow-sm">
                            <div class="card-body">
                                <h5 class="card-title text-primary">${post.title}</h5>
                                <div class="card-text">${post.content}</div>
                                <hr>
                                <small class="text-muted">發佈日期：${new Date(post.created_at).toLocaleDateString()}</small>
                            </div>
                        </div>
                    `;
                }
            });

            // 處理空分類的顯示 (可選)
            categories.forEach(cat => {
                const el = document.getElementById(`cat-${cat}`);
                if (el && el.innerHTML === '') {
                    el.innerHTML = '<p class="text-muted">目前暫無公告</p>';
                }
            });
        }

        // 3. 關鍵：網頁載入後立即執行
        loadPosts();
    </script>
</body>
</html>
