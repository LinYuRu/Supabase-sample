    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // 1. 初始化 Supabase
        const SUPABASE_URL = 'https://awenxjiniepxbnbxdefl.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_-tvu7CWehM2faugobpRR7w_wVl0tL2g';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    // 全域宣告公告變數
    let editModalInstance = null;

    // 定義代碼與中文名稱的對照表
    const categoryMapping = { 'general': '一般公告', 'event': '活動訊息', 'member': '會員專區', 'rules': '理監事會議紀錄' };

async function loadPreview() {
    try {
        // 查詢包含 id, title, category, content, created_at
        const { data, error } = await _supabase
            .from('posts')
            .select('id, title, category, content, created_at')
            .order('created_at', { ascending: false })
            .limit(3);
            
        if (error) throw error;
        
        const list = document.getElementById('preview-list');
        if (data && data.length > 0) {
            list.innerHTML = data.map(post => {
                // 1. 先轉成 JSON 字串
                let postStr = JSON.stringify(post);
                // 2. 將反斜線、換行符號與雙引號進行特殊處理，避免破壞 HTML 屬性與 JS 語法
                postStr = postStr
                    .replace(/\\/g, '\\\\')    // 處理可能已存在的反斜線
                    .replace(/"/g, '&quot;')   // 處理雙引號
                    .replace(/\n/g, '\\n')     // 將真正的換行轉成字串文字 \n
                    .replace(/\r/g, '\\r');    // 將真正的斷行回車轉成字串文字 \r

                return `
                    <a href="javascript:void(0)" onclick="showAnnouncement('${postStr}')" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-3 px-4 border-0 border-bottom">
                        <span class="fw-bold text-dark"><i class="bi bi-dot text-warning fs-4 align-middle"></i>${post.title}</span>
                        <small class="text-muted bg-light px-2 py-1 rounded-2">${new Date(post.created_at).toLocaleDateString()}</small>
                    </a>
                `;
            }).join('');
        } else {
            document.getElementById('preview-list').innerHTML = '<div class="p-4 text-center text-muted">目前暫無最新公告</div>';
        }
    } catch (e) {
        console.error("載入最新公告發生錯誤:", e);
    }
}

function showAnnouncement(postStr) {
    const post = JSON.parse(postStr);
    
    // 1. 寫入隱藏的 ID 欄位
    document.getElementById('edit-id').value = post.id || '';
    
    // 2. 將轉換後的「種類中文文字」放入對應的 div
    const categoryChinese = categoryMapping[post.category] || post.category || '一般公告';
    document.getElementById('view-category').innerText = categoryChinese;
    
    // 3. 將「標題」放入對應的 div
    document.getElementById('view-title').innerText = post.title || '';
    
    // 4. 將「內容」放入對應的 div
    if (post.content) {
        // 如果原本是純文字且帶有 \n 換行，將 \n 轉換為 <br> 才能在 innerHTML 中正確換行顯示
        // 如果資料原本就是 HTML 格式，這行則不會受影響
        const formattedContent = post.content.replace(/\n/g, '<br>');
        document.getElementById('view-text').innerHTML = formattedContent;
    } else {
        document.getElementById('view-text').innerHTML = '<span class="text-muted">（無內文）</span>';
    }
    
    // 5. 顯示彈出視窗
    if (!editModalInstance) {
        editModalInstance = new bootstrap.Modal(document.getElementById('editModal'));
    }
    editModalInstance.show();
}

// 監聽 DOM 載入
document.addEventListener('DOMContentLoaded', async function() {
    await loadPreview();
    
    editModalInstance = new bootstrap.Modal(document.getElementById('editModal'));

    const targetSection = document.getElementById('latest-announcements');
    if (targetSection) {
        setTimeout(() => {
            targetSection.scrollIntoView({
                behavior: 'smooth',
                block: 'center'
            });
        }, 250);
    }
});

</script>
