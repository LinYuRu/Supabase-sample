<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>永和慢跑 - Supabase 測試版</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="p-5">

    <div class="container">
        <h1>永和慢跑最新公告</h1>
        <hr>
        <div id="loading" class="text-secondary">讀取資料庫中...</div>
        <div id="post-list" class="row"></div>
    </div>

    <script>
        // 1. 初始化 Supabase (請替換成你的專案資訊)
        // 這些可以在 Supabase Project Settings -> API 找到
        const SUPABASE_URL = 'https://awenxjiniepxbnbxdefl.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_-tvu7CWehM2faugobpRR7w_wVl0tL2g';
        const _supabase = supabase.createClient(https://linyuru.github.io/Supabase-sample/, sb_publishable_-tvu7CWehM2faugobpRR7w_wVl0tL2g);

        // 2. 從資料庫抓取資料
        async function fetchPosts() {
            const { data, error } = await _supabase
                .from('posts')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('抓取失敗:', error);
                document.getElementById('loading').innerText = "連線失敗";
                return;
            }

            displayPosts(data);
        }

        // 3. 渲染到 HTML
        function displayPosts(posts) {
            const list = document.getElementById('post-list');
            const loading = document.getElementById('loading');
            loading.style.display = 'none';

            posts.forEach(post => {
                const card = `
                    <div class="col-md-6 mb-3">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">${post.title}</h5>
                                <p class="card-text">${post.content}</p>
                                <small class="text-muted">${new Date(post.created_at).toLocaleDateString()}</small>
                            </div>
                        </div>
                    </div>
                `;
                list.innerHTML += card;
            });
        }

        fetchPosts();
    </script>
</body>
</html>
