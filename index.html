    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // 1. 初始化 Supabase
        const SUPABASE_URL = 'https://awenxjiniepxbnbxdefl.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_-tvu7CWehM2faugobpRR7w_wVl0tL2g';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 2. 定義讀取資料函式
        async function loadPosts() {
            const { data, error } = await _supabase
                .from('posts')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('抓取失敗:', error);
                return;
            }

            // 先清空所有容器
            const categories = ['general', 'event', 'member', 'rules'];
            categories.forEach(cat => {
                const el = document.getElementById(`cat-${cat}`);
                if (el) el.innerHTML = '';
            });

            // 分流渲染資料
            data.forEach(post => {
                // 注意：這裡的 post.category 必須對應資料庫欄位裡的值 (例如 'general')
                const container = document.getElementById(`cat-${post.category}`);
                if (container) {
                    container.innerHTML += `
                        <div class="card mb-3 shadow-sm">
                            <div class="card-body">
                                <h5 class="card-title text-primary">${post.title}</h5>
                                <div class="card-text">${post.content}</div>
                                <hr>
                                <small class="text-muted">發佈日期：${new Date(post.created_at).toLocaleDateString()}</small>
                            </div>
                        </div>
                    `;
                }
            });

            // 處理空分類的顯示 (可選)
            categories.forEach(cat => {
                const el = document.getElementById(`cat-${cat}`);
                if (el && el.innerHTML === '') {
                    el.innerHTML = '<p class="text-muted">目前暫無公告</p>';
                }
            });
        }

        // 3. 關鍵：網頁載入後立即執行
<!--        loadPosts();-->


    // 在 index.html 的 script 區塊只需簡單抓取前 3 筆
    async function loadPreview() {
        const { data, error } = await _supabase
            .from('posts')
            .select('title, created_at')
            .order('created_at', { ascending: false })
            .limit(3);

        const list = document.getElementById('preview-list');
        if (data && data.length > 0) {
            list.innerHTML = data.map(post => `
                <a href="./resources/announcements.html" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-3">
                    <span class="fw-bold">${post.title}</span>
                    <small class="text-muted">${new Date(post.created_at).toLocaleDateString()}</small>
                </a>
            `).join('');
        } else {
            list.innerHTML = "目前尚無公告";
        }
    }
    loadPreview();
    </script>
