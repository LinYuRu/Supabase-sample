async function loadPosts() {
    const { data, error } = await _supabase.from('posts').select('*').order('created_at', { ascending: false });
    
    // 先清空所有容器
    const categories = ['general', 'event', 'member', 'rules'];
    categories.forEach(cat => document.getElementById(`cat-${cat}`).innerHTML = '');

    data.forEach(post => {
        const container = document.getElementById(`cat-${post.category}`);
        if (container) {
            container.innerHTML += `
                <div class="card mb-3">
                    <div class="card-body">
                        <h5 class="card-title">${post.title}</h5>
                        <div class="card-text">${post.content}</div>
                    </div>
                </div>
            `;
        }
    });
}
