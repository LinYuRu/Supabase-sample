<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>

        document.addEventListener('DOMContentLoaded', function() {
            
            // ======= 功能一：處理來自首頁或其他頁面的網址指定 Tab 跳轉 =======
            // 取得網址列上的 Hash 值 (例如: #cat-story)
            const hash = window.location.hash;
            if (hash) {
                // 尋找對應代號的 Tab 內容區塊
                const targetTabPane = document.querySelector(hash);
                if (targetTabPane) {
                    // 依據內容區塊，回溯找到上方導覽列對應的按鈕
                    // 這裡利用了當初設定的 data-bs-target 屬性
                    const targetTabButton = document.querySelector(`[data-bs-target="${hash}"]`);
                    
                    if (targetTabButton) {
                        // 使用 Bootstrap 內建方法將該頁籤啟用顯示
                        const tabTrigger = new bootstrap.Tab(targetTabButton);
                        tabTrigger.show();
                    }
                }
            }
    
            // ======= 功能二：控制理事會章則手風琴全部展開與收合 =======
            const accordionEl = document.getElementById('rightsAccordion');
            if (accordionEl) {
                const collapseNodes = accordionEl.querySelectorAll('.accordion-collapse');
                
                // 點擊「全部展開」
                const btnExpandAll = document.getElementById('btnExpandAll');
                if (btnExpandAll) {
                    btnExpandAll.addEventListener('click', function() {
                        collapseNodes.forEach(function(node) {
                            const bsCollapse = bootstrap.Collapse.getOrCreateInstance(node, { toggle: false });
                            bsCollapse.show();
                        });
                    });
                }
    
                // 點擊「全部收合」
                const btnCollapseAll = document.getElementById('btnCollapseAll');
                if (btnCollapseAll) {
                    btnCollapseAll.addEventListener('click', function() {
                        collapseNodes.forEach(function(node) {
                            const bsCollapse = bootstrap.Collapse.getOrCreateInstance(node, { toggle: false });
                            bsCollapse.hide();
                        });
                    });
                }
            }
        });

</script>
</body>
