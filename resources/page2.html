<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">

            </div>

<!--公告END-->
<script>


// 初始化 Supabase
const SUPABASE_URL = 'https://awenxjiniepxbnbxdefl.supabase.co'; const SUPABASE_ANON_KEY = 'sb_publishable_-tvu7CWehM2faugobpRR7w_wVl0tL2g'; const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
// 全域宣告公告變數
let editModalInstance = null; const categoryMapping = { 'general': '一般公告', 'event': '活動訊息', 'member': '會員專區', 'rules': '理監事會議紀錄' };


async function loadPreview() {
    try {
        // 1. 精準查詢「每月會訊」(只抓 general)
        const { data: generalData, error: generalError } = await _supabase
            .from('posts')
            .select('id, title, category, content, created_at')
            .eq('category', 'general')
            .order('created_at', { ascending: false })
            .limit(3);
            
        if (generalError) throw generalError;
        renderPostList(generalData, 'preview-list', '目前暫無最新會訊');

        // 2. 精準查詢「會議紀錄」(只抓 rules)
        const { data: rulesData, error: rulesError } = await _supabase
            .from('posts')
            .select('id, title, category, content, created_at')
            .eq('category', 'rules')
            .order('created_at', { ascending: false })
            .limit(3);
            
        if (rulesError) throw rulesError;
        renderPostList(rulesData, 'rules-list', '目前暫無會議紀錄');

    } catch (e) {
        console.error("載入最新公告發生錯誤:", e);
    }
}

// 抽取共用的渲染 HTML 函數，避免程式碼重複
function renderPostList(data, containerId, emptyMessage) {
    const list = document.getElementById(containerId);
    if (!list) return;

    if (data && data.length > 0) {
        list.innerHTML = data.map(post => {
            const categoryChinese = (typeof categoryMapping !== 'undefined' && categoryMapping[post.category])
                                    || post.category
                                    || (post.category === 'general' ? '每月會訊' : '會議紀錄');

            let badgeColorClass = 'bg-general';
            if (post.category === 'general') badgeColorClass = 'bg-general';
            else if (post.category === 'event') badgeColorClass = 'bg-event';
            else if (post.category === 'member') badgeColorClass = 'bg-member';
            else if (post.category === 'rules') badgeColorClass = 'bg-rules';
            else {
                if (categoryChinese.includes('活動')) badgeColorClass = 'bg-event';
                else if (categoryChinese.includes('會員')) badgeColorClass = 'bg-member';
                else if (categoryChinese.includes('章則') || categoryChinese.includes('辦法') || categoryChinese.includes('紀錄')) badgeColorClass = 'bg-rules';
            }

            // 處理換行符號與引號，防止遇到內文換行時 JS 語法崩潰
            let postStr = JSON.stringify(post)
                .replace(/\\/g, '\\\\')
                .replace(/"/g, '&quot;')
                .replace(/\n/g, '\\n')
                .replace(/\r/g, '\\r');

            return `
                <a href="javascript:void(0)" onclick="showAnnouncement('${postStr}')"
                   class="post-card list-group-item list-group-item-action d-flex justify-content-between align-items-center py-3 px-4 mb-2 rounded shadow-sm text-decoration-none">
                    <span class="text-dark d-flex align-items-center">
                        <span class="category-badge ${badgeColorClass} me-3 fw-bold">${categoryChinese}</span>
                        <span class="fw-bold text-truncate" style="max-width: 500px;">${post.title}</span>
                    </span>
                    <small class="text-muted bg-light px-2 py-1 rounded-2">${new Date(post.created_at).toLocaleDateString()}</small>
                </a>
            `;
        }).join('');
    } else {
        list.innerHTML = `<div class="p-4 text-center text-muted">${emptyMessage}</div>`;
    }
}

// 顯示 Modal 彈出視窗
function showAnnouncement(postStr) {
    const post = JSON.parse(postStr);
    
    document.getElementById('edit-id').value = post.id || '';
    
    // 如果 categoryMapping 沒有定義，就使用預設中文
    const defaultChinese = post.category === 'general' ? '每月會訊' : (post.category === 'rules' ? '會議紀錄' : '一般公告');
    const categoryChinese = (typeof categoryMapping !== 'undefined' && categoryMapping[post.category]) || defaultChinese;
    
    document.getElementById('view-category').innerText = categoryChinese;
    document.getElementById('view-title').innerText = post.title || '';
    
    if (post.content) {
        const formattedContent = post.content.replace(/\n/g, '<br>');
        document.getElementById('view-text').innerHTML = formattedContent;
    } else {
        document.getElementById('view-text').innerHTML = '<span class="text-muted">（無內文）</span>';
    }
    
    if (!editModalInstance) {
        editModalInstance = new bootstrap.Modal(document.getElementById('editModal'));
    }
    editModalInstance.show();
}

$(document).ready(async function() {
    // 先執行非同步的公告載入
    await loadPreview();
    
});

</script>
