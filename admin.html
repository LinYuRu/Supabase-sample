<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>永和慢跑 - 管理員後台</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --primary-color: #0d6efd; }
        body { background-color: #f8f9fa; font-family: "Microsoft JhengHei", sans-serif; }

        #login-section { min-height: 80vh; display: flex; align-items: center; }
        .container { max-width: 950px; }

        .post-card {
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
            border-left: 5px solid var(--primary-color);
        }
        .post-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1) !important;
        }

        .category-badge { font-size: 0.75rem; padding: 0.3em 0.8em; border-radius: 50px; }
        .bg-general { background-color: #e9ecef; color: #495057; }
        .bg-event { background-color: #cfe2ff; color: #084298; }
        .bg-member { background-color: #d1e7dd; color: #0f5132; }
        .bg-rules { background-color: #fff3cd; color: #664d03; }

        #admin-content { display: none; margin-top: 40px; margin-bottom: 60px; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-section">
        <div class="card p-4 shadow-sm mx-auto w-100" style="max-width: 400px;">
            <div class="text-center mb-4">
                <div class="bg-primary text-white rounded-circle d-inline-block p-3 mb-2">
                    <i class="bi bi-person-lock fs-2"></i>
                </div>
                <h3>管理員登入</h3>
                <p class="text-muted small">請輸入憑證以進入永和慢跑後台</p>
            </div>
            <div class="mb-3">
                <label class="form-label small">Email</label>
                <input type="email" id="email" class="form-control" placeholder="admin@example.com">
            </div>
            <div class="mb-4">
                <label class="form-label small">密碼</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••">
            </div>
            <button onclick="handleLogin()" class="btn btn-primary w-100 py-2">
                <i class="bi bi-box-arrow-in-right me-1"></i> 進入後台
            </button>
        </div>
    </div>

    <div id="admin-content">
        <ul class="nav nav-tabs mb-4" id="adminTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active fw-bold" id="posts-tab" data-bs-toggle="tab" data-bs-target="#posts-panel" type="button">
                    <i class="bi bi-megaphone me-1"></i> 公告管理
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link fw-bold" id="members-tab" data-bs-toggle="tab" data-bs-target="#members-panel" type="button">
                    <i class="bi bi-people me-1"></i> 會員管理
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link fw-bold" id="activities-tab" data-bs-toggle="tab" data-bs-target="#activities-panel" type="button">
                    <i class="bi bi-calendar-event me-1"></i> 活動管理
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link fw-bold text-danger" id="attendance-tab" data-bs-toggle="tab" data-bs-target="#attendance-panel" type="button">
                    <i class="bi bi-check2-square me-1"></i> 出席點名紀錄
                </button>
            </li>
        </ul>

        <div class="tab-content" id="adminTabContent">
            <div class="tab-pane fade show active" id="posts-panel" role="tabpanel">
                <div class="row align-items-center mb-4">
                    <div class="col">
                        <h4 class="fw-bold mb-0">最新公告列表</h4>
                    </div>
                    <div class="col-auto">
                        <button onclick="openAddModal()" class="btn btn-success shadow-sm">
                            <i class="bi bi-plus-lg me-1"></i> 新增公告
                        </button>
                    </div>
                </div>
                <div id="posts-list"></div>
            </div>
            
            <div class="tab-pane fade" id="members-panel" role="tabpanel">
                <div class="row align-items-center mb-4">
                    <div class="col">
                        <h4 class="fw-bold mb-0">會員資料庫</h4>
                    </div>
                    <div class="col-auto">
                        <select id="group-filter" class="form-select shadow-sm" style="min-width: 140px;">
                            <option value="all">全部組別</option>
                        </select>
                    </div>
                    <div class="col-auto">
                        <select id="category-filter" class="form-select shadow-sm" style="min-width: 160px;">
                            <option value="all">全部類別</option>
                        </select>
                    </div>
                    <div class="col-auto">
                        <button onclick="openMemberModal()" class="btn btn-primary shadow-sm">
                            <i class="bi bi-person-plus me-1"></i> 新增會員
                        </button>
                    </div>
                </div>
                <div id="members-list"></div>
            </div>
            
            <div class="tab-pane fade" id="activities-panel" role="tabpanel">
                <div class="row align-items-center mb-4">
                    <div class="col">
                        <h4 class="fw-bold mb-0">活動賽事管理</h4>
                    </div>
                    <div class="col-auto">
                        <select id="type-filter" class="form-select shadow-sm" style="min-width: 140px;">
                            <option value="all">全部類型</option>
                        </select>
                    </div>
                    <div class="col-auto">
                        <select id="year-filter" class="form-select shadow-sm" style="min-width: 140px;">
                            <option value="all">全部年份</option>
                        </select>
                    </div>
                    <div class="col-auto">
                        <button onclick="openActivityModal()" class="btn btn-warning shadow-sm fw-bold text-dark">
                            <i class="bi bi-calendar-plus me-1"></i> 新增活動
                        </button>
                    </div>
                </div>
                <div id="activities-list"></div>
            </div>

            <div class="tab-pane fade" id="attendance-panel" role="tabpanel">
                <div class="card shadow-sm border-0 p-4 bg-white mb-4">
                    <h4 class="fw-bold text-dark mb-3"><i class="bi bi-clipboard-check me-2 text-danger"></i>活動出席點名系統</h4>
                    <div class="row g-3 align-items-center mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">第一步：請選取目標活動</label>
                            <select id="attendance-activity-select" class="form-select form-select-lg border-primary" onchange="loadAttendanceSheet()">
                                <option value="">-- 請選擇活動 --</option>
                            </select>
                        </div>
                        <div class="col-md-6 text-md-end mt-4">
                            <button id="save-attendance-btn" onclick="submitAttendanceSheet()" class="btn btn-danger btn-lg px-4 shadow-sm" disabled>
                                <i class="bi bi-cloud-upload me-1"></i> 儲存本次點名紀錄
                            </button>
                        </div>
                    </div>

                    <hr>

                    <div id="attendance-sheet-container">
                        <p class="text-muted text-center py-5">請先於上方選擇一項活動以載入簽到名單。</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="text-center mt-5">
            <button onclick="handleLogout()" class="btn btn-sm btn-outline-secondary">
                <i class="bi bi-door-open me-1"></i> 登出管理系統
            </button>
        </div>
    </div>
</div>

<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title" id="modalTitle">編輯公告</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <input type="hidden" id="edit-id">
                <div class="mb-3">
                    <label class="form-label fw-bold">公告種類</label>
                    <select id="edit-category" class="form-select">
                        <option value="general">一般公告</option>
                        <option value="event">活動訊息</option>
                        <option value="member">會員專區</option>
                        <option value="rules">規章制度</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">標題</label>
                    <input type="text" id="edit-title" class="form-control" placeholder="例如：春季團練公告">
                </div>
                <div class="mb-0">
                    <label class="form-label fw-bold">內容</label>
                    <textarea id="edit-text" class="form-control" rows="6" placeholder="支援 HTML 標籤..."></textarea>
                </div>
            </div>
            <div class="modal-footer bg-light">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button onclick="submitSave()" class="btn btn-primary px-4" id="saveBtn">儲存</button>
            </div>
        </div>
    </div>
</div>
<div class="modal fade" id="memberModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title"><i class="bi bi-person-plus me-2"></i>新增會員資料</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <form id="memberForm">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">姓名</label>
                            <input type="text" id="m-name" class="form-control" required placeholder="請輸入姓名">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">性別</label>
                            <select id="m-gender" class="form-select">
                                <option value="">請選擇性別</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">出生年月日</label>
                            <input type="date" id="m-birth_date" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">電話</label>
                            <input type="tel" id="m-phone" class="form-control" value="09" placeholder="0912-345678">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Email (登入/聯繫用)</label>
                            <input type="email" id="m-email" class="form-control" value="@gmail.com" placeholder="example@mail.com">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">會員類別</label>
                            <select id="m-category" class="form-select"></select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">所屬組別</label>
                            <select id="m-group_number" class="form-select">
                                <option value="">請選擇組別</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">通訊地址</label>
                            <input type="text" id="m-address" class="form-control" placeholder="請輸入完整地址">
                        </div>
                        <div class="col-md-6">
                            <div class="form-check form-switch mt-2">
                                <input class="form-check-input" type="checkbox" id="m-is_student">
                                <label class="form-check-label fw-bold" for="m-is_student">具備學生身份</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-check form-switch mt-2">
                                <input class="form-check-input" type="checkbox" id="m-entrance_fee_paid">
                                <label class="form-check-label fw-bold" for="m-entrance_fee_paid">已繳納入會費 (1000元)</label>
                            </div>
                        </div>
                        
                        <div class="col-md-6">
                            <label class="form-label fw-bold text-success">常年會費有效年份 (已繳至)</label>
                            <select id="m-annual_fee_paid_until" class="form-select border-success">
                                <option value="">未繳交/無紀錄</option>
                                <script>
                                    const y = new Date().getFullYear();
                                    document.write(`
                                        <option value="${y+1}">${y+1} 年份</option>
                                        <option value="${y}" selected>${y} 年份</option>
                                        <option value="${y-1}">${y-1} 年份</option>
                                    `);
                                </script>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <div class="form-check form-switch mt-4">
                                <input class="form-check-input border-success" type="checkbox" id="m-is_next_year_free">
                                <label class="form-check-label fw-bold text-success" for="m-is_next_year_free">特殊優惠：下一年免常年會費</label>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="card border-info bg-light-subtle">
                                <div class="card-header bg-info text-white py-2 fw-bold">
                                    <i class="bi bi-shield-check me-2"></i>社團服裝裝備發放數量紀錄
                                </div>
                                <div class="card-body py-3">
                                    <div class="row g-3">
                                        <div class="col-md-4">
                                            <label class="form-label fw-bold">背心 (vest)</label>
                                            <input type="number" id="m-gear-vest" class="form-control" min="0" value="0" placeholder="發放數量">
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label fw-bold">長袖 (long_sleeve)</label>
                                            <input type="number" id="m-gear-long" class="form-control" min="0" value="0" placeholder="發放數量">
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label fw-bold">短袖 (short_sleeve)</label>
                                            <input type="number" id="m-gear-short" class="form-control" min="0" value="0" placeholder="發放數量">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer bg-light">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button onclick="submitMember()" class="btn btn-primary px-4" id="memberSaveBtn">儲存會員</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="activityModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-md modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-warning text-dark">
                <h5 class="modal-title fw-bold"><i class="bi bi-calendar-plus me-2"></i>新增活動賽事</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <form id="activityForm">
                    <div class="mb-3">
                        <label class="form-label fw-bold">活動名稱 / 賽事名稱</label>
                        <input type="text" id="a-title" class="form-control" required placeholder="例如：2026 金山馬拉松團報">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">活動日期</label>
                        <input type="date" id="a-activity_date" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">活動地點</label>
                        <input type="text" id="a-location" class="form-control" placeholder="例如：新北市金山區">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">活動類型</label>
                        <select id="a-activity_type" class="form-select">
                            <option value="團練">例行團練</option>
                            <option value="賽事">官方賽事 / 團報</option>
                            <option value="聚會">聯誼聚餐</option>
                            <option value="其他">其他活動</option>
                        </select>
                    </div>
                    <div class="mb-0">
                        <div class="form-check form-switch mt-2">
                            <input class="form-check-input" type="checkbox" id="a-is_locked">
                            <label class="form-check-label fw-bold" for="a-is_locked">鎖定活動 (禁止修改/報名)</label>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer bg-light">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button onclick="submitActivity()" class="btn btn-warning px-4 fw-bold text-dark" id="activitySaveBtn">儲存活動</button>
            </div>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://awenxjiniepxbnbxdefl.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_-tvu7CWehM2faugobpRR7w_wVl0tL2g';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

	
	// 會員清單排序全域變數：擴充儲存目前表格的排序狀態 (預設組別升冪)
	let currentSort = { key: 'group_number', asc: true };
    // 組別也可以用 Map 維護，方便未來要更改成「A組、B組」或擴充組數
    const genderMap = new Map([ ['Male', '男'], ['Female', '女'] ]);
    const categoryMap = new Map([ ['Applicant', '申請中 (新入會)'], ['Student', '學生會員'], ['General', '一般會員'], ['Permanent', '永久會員'] ]);
    const groupMap = new Map([ ['1', '第 1 組'], ['2', '第 2 組'], ['3', '第 3 組'], ['4', '第 4 組'], ['5', '第 5 組'], ['6', '第 6 組'], ['7', '第 7 組'], ['8', '第 8 組'], ['9', '第 9 組'] ]);

    let editModal, memberModal, activityModal;
    let currentMemberId = null;
    let currentActivityId = null;

    const catNames = { 'general': '一般公告', 'event': '活動訊息', 'member': '會員專區', 'rules': '規章制度' };

    document.addEventListener('DOMContentLoaded', () => {
        editModal = new bootstrap.Modal(document.getElementById('editModal'));
        memberModal = new bootstrap.Modal(document.getElementById('memberModal'));
        activityModal = new bootstrap.Modal(document.getElementById('activityModal'));

        document.getElementById('members-tab').addEventListener('shown.bs.tab', () => loadMembers());
        document.getElementById('activities-tab').addEventListener('shown.bs.tab', () => loadActivities());

        // 切換到點名 Tab 時，初始化活動下拉選單
        document.getElementById('attendance-tab').addEventListener('shown.bs.tab', () => loadAttendanceActivitiesDropdown());

        checkSession();
    });
    
	document.addEventListener('DOMContentLoaded', function() {
		// 透過 id 抓取輸入框元素
		const mNameInput = document.getElementById('m-name');
		
		// 確保頁面上確實有這個輸入框才綁定事件
		if (mNameInput) {
			mNameInput.addEventListener('change', function(event) {
				// 取得目前輸入框內的最新文字
				const currentInputValue = event.target.value;
				
				if (currentInputValue.includes('天穎')) {
					alert('雞掰人不得入會！');
				}
			});
		}
	});

    async function checkSession() {
        const { data: { session } } = await _supabase.auth.getSession();
        if (session) showAdmin();
    }

    async function handleLogin() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const { error } = await _supabase.auth.signInWithPassword({ email, password });
        if (error) alert("登入失敗: " + error.message); else showAdmin();
    }

    function showAdmin() {
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('admin-content').style.display = 'block';
        loadPosts();
    }

    async function handleLogout() { await _supabase.auth.signOut(); location.reload(); }

    /* ==========================================
       1. 公告管理 邏輯
       ========================================== */
    async function loadPosts() {
        const listDiv = document.getElementById('posts-list');
        listDiv.innerHTML = '<div class="text-center p-5"><div class="spinner-border text-primary"></div></div>';
        const { data, error } = await _supabase.from('posts').select('*').order('created_at', { ascending: false });
        if (error) { listDiv.innerHTML = `<div class="alert alert-danger">載入失敗: ${error.message}</div>`; return; }

        listDiv.innerHTML = '';
        data.forEach(post => {
            listDiv.innerHTML += `
                <div class="card post-card shadow-sm p-3 mb-3 bg-white">
                    <div class="row align-items-center">
                        <div class="col">
                            <span class="category-badge bg-${post.category || 'general'} mb-2 d-inline-block">${catNames[post.category] || '未分類'}</span>
                            <h5 class="mb-1 fw-bold text-dark">${post.title}</h5>
                            <small class="text-muted"><i class="bi bi-clock me-1"></i>${new Date(post.created_at).toLocaleDateString()}</small>
                        </div>
                        <div class="col-auto">
                            <button class="btn btn-outline-primary btn-sm me-1" onclick="openEditModal(${post.id}, '${post.title}', \`${post.content}\`, '${post.category}')"><i class="bi bi-pencil"></i> 編輯</button>
                            <button class="btn btn-outline-danger btn-sm" onclick="handleDelete(${post.id})"><i class="bi bi-trash"></i> 刪除</button>
                        </div>
                    </div>
                </div>`;
        });
    }

    function openAddModal() {
        document.getElementById('modalTitle').innerText = "新增公告"; document.getElementById('saveBtn').innerText = "立即發佈";
        document.getElementById('edit-id').value = ""; document.getElementById('edit-title').value = "";
        document.getElementById('edit-text').value = ""; document.getElementById('edit-category').value = "general";
        editModal.show();
    }

    function openEditModal(id, title, content, category) {
        document.getElementById('modalTitle').innerText = "編輯公告"; document.getElementById('saveBtn').innerText = "儲存修改";
        document.getElementById('edit-id').value = id; document.getElementById('edit-title').value = title;
        document.getElementById('edit-text').value = content; document.getElementById('edit-category').value = category || "general";
        editModal.show();
    }

    async function submitSave() {
        const id = document.getElementById('edit-id').value; const title = document.getElementById('edit-title').value;
        const content = document.getElementById('edit-text').value; const category = document.getElementById('edit-category').value;

	async function submitMember() {
		const name = $('#m-name').val().trim();
		const email = $('#m-email').val().trim();
		const birth_date = $('#m-birth_date').val();
		if (!name || !birth_date || !email) return alert("請填寫姓名、出生年月日與 Email");
		
		// 1. 自動抓取當前電腦系統年份
		const currentYear = new Date().getFullYear();
		
		// 2. 獲取表單輸入的會費已繳交年份
		const inputPaidUntil = $('#m-annual_fee_paid_until').val();
		const annual_fee_paid_until = inputPaidUntil ? parseInt(inputPaidUntil) : null;
		
		// 3. 獲取管理員手動勾選的「明年是否免會費」
		let is_next_year_free = $('#m-is_next_year_free').prop('checked');
		
		// 邏輯優化：若費用收過明年，自動校正免會費標記
		if (annual_fee_paid_until && annual_fee_paid_until > currentYear) {
			is_next_year_free = false;
		}
		
		// 4. 封裝服裝發放數量的 JSON 結構
		const gear_received_json = {
			vest: parseInt($('#m-gear-vest').val()) || 0,
			long_sleeve: parseInt($('#m-gear-long').val()) || 0,
			short_sleeve: parseInt($('#m-gear-short').val()) || 0
		};
		
		// ─── 5. 獲取當前系統登入的操作者人員 ───
		let operatorName = 'System';
		try {
			const { data: { user }, error: userError } = await _supabase.auth.getUser();
			if (!userError && user) {
				// 可依您的系統偏好選擇儲存 user.email 或 user.id
				operatorName = user.email || user.id;
			}
		} catch (e) {
			console.error("無法取得當前使用者資訊：", e);
		}
		// ─────────────────────────────────────
		
		const payload = {
			name, email, birth_date,
			gender: $('#m-gender').val() || null,
			phone: $('#m-phone').val().trim() || null,
			category: $('#m-category').val(),
			group_number: $('#m-group_number').val() ? parseInt($('#m-group_number').val()) : null,
			address: $('#m-address').val().trim() || null,
			is_student: $('#m-is_student').prop('checked'),
			entrance_fee_paid: $('#m-entrance_fee_paid').prop('checked'),
			
			// 常年會費與服裝相關欄位
			annual_fee_paid_until: annual_fee_paid_until,
			is_next_year_free: is_next_year_free,
			gear_received_json: gear_received_json,
			
			// ─── 新增：指派更動人員 ───
			updated_by: operatorName
			// 註：updated_at 不需要手動傳入，SQL Database 端的 Trigger 觸發器會自行動態更新時間
		};
		
		let { error } = currentMemberId ?
			await _supabase.from('members').update(payload).eq('id', currentMemberId) :
			await _supabase.from('members').insert([payload]);
			
		if (error) {
			alert("錯誤: " + error.message);
		} else {
			memberModal.hide();
			loadMembers();
		}
	}


async function loadMembers() {
   const { data, error } = await _supabase.from('members').select('*');
   if (error) return;

   // 1. 核心排序邏輯
   data.sort((a, b) => {
      let valA = a[currentSort.key];
      let valB = b[currentSort.key];

      if (currentSort.key === 'group_number') {
         if (valA === null || valA === undefined) return 1;
         if (valB === null || valB === undefined) return -1;
         return currentSort.asc ? valA - valB : valB - valA;
      }
      
      if (currentSort.key === 'category') {
         if (!valA) return 1;
         if (!valB) return -1;
         const textA = categoryMap.has(valA) ? categoryMap.get(valA) : valA;
         const textB = categoryMap.has(valB) ? categoryMap.get(valB) : valB;
         return currentSort.asc ? textA.localeCompare(textB, 'zh-TW') : textB.localeCompare(textA, 'zh-TW');
      }
      return 0;
   });

   // 2. 記錄並動態生成【組別過濾選單】
   const $groupFilter = $('#group-filter');
   const currentSelectedGroup = $groupFilter.val();
   const groupsSet = new Set();
   
   // 3. 記錄並動態生成【類別過濾選單】
   const $categoryFilter = $('#category-filter');
   const currentSelectedCategory = $categoryFilter.val();
   const categoriesSet = new Set();

   // 提取現有的不重複組別與類別代碼
   $.each(data, function(index, m) {
   if (m.group_number !== null && m.group_number !== undefined) {
      groupsSet.add(m.group_number);
   }
   if (m.category) {
      categoriesSet.add(m.category);
   }
   });
   
   // 渲染組別選單
   const sortedGroups = Array.from(groupsSet).sort((a, b) => a - b);
   let groupSelectHtml = `<option value="all">全部組別</option>`;
   $.each(sortedGroups, function(index, g) {
   const groupText = groupMap.has(String(g)) ? groupMap.get(String(g)) : g + '組';
   groupSelectHtml += `<option value="${g}">${groupText}</option>`;
   });
   groupSelectHtml += `<option value="none">未分組</option>`;
   $groupFilter.html(groupSelectHtml);
   if (currentSelectedGroup && $groupFilter.find(`option[value="${currentSelectedGroup}"]`).length > 0) {
   $groupFilter.val(currentSelectedGroup);
   }

   // 渲染類別選單 (依 Map 對應的中文名稱排序，讓介面更好看)
   const sortedCategories = Array.from(categoriesSet).sort((a, b) => {
      const textA = categoryMap.get(a) || a;
      const textB = categoryMap.get(b) || b;
      return textA.localeCompare(textB, 'zh-TW');
   });
   let categorySelectHtml = `<option value="all">全部類別</option>`;
   $.each(sortedCategories, function(index, c) {
      const categoryText = categoryMap.has(c) ? categoryMap.get(c) : c;
      categorySelectHtml += `<option value="${c}">${categoryText}</option>`;
   });
   $categoryFilter.html(categorySelectHtml);
   if (currentSelectedCategory && $categoryFilter.find(`option[value="${currentSelectedCategory}"]`).length > 0) {
      $categoryFilter.val(currentSelectedCategory);
   }

   // 4. 產生標頭排序符號 (▲/▼)
   const categorySortIcon = currentSort.key === 'category' ? (currentSort.asc ? ' ▲' : ' ▼') : '';
   const groupSortIcon = currentSort.key === 'group_number' ? (currentSort.asc ? ' ▲' : ' ▼') : '';

   // 5. 渲染表格結構 (在 tr 埋入 data-group 與 data-category 屬性供 jQuery 過濾)
   let tableHtml = `
   <div class="table-responsive bg-white rounded shadow-sm border p-3">
      <table class="table table-hover align-middle">
         <thead>
            <tr>
            <th>姓名</th>
            <th>聯絡電話</th>
            <th class="sort-th text-primary" data-key="category" style="cursor: pointer; user-select: none;">類別<small>${categorySortIcon}</small></th>
            <th class="sort-th text-primary" data-key="group_number" style="cursor: pointer; user-select: none;">組別<small>${groupSortIcon}</small></th>
            <th>操作</th>
            </tr>
         </thead>
         <tbody>`;
         
   $.each(data, function(index, m) {
   // 重要防呆：為防 JSON 轉型出錯，確保傳遞正確的字串格式
   const memberJson = JSON.stringify(m).replace(/'/g, "&apos;").replace(/"/g, "&quot;");
   const groupAttr = m.group_number ? m.group_number : 'none';
   const categoryAttr = m.category ? m.category : 'none';
   
   const displayCategory = categoryMap.has(m.category) ? categoryMap.get(m.category) : (m.category || '-');
   
   let displayGroup = '-';
   if (m.group_number !== null && m.group_number !== undefined) {
      displayGroup = groupMap.has(String(m.group_number)) ? groupMap.get(String(m.group_number)) : m.group_number + '組';
   }
   
   tableHtml += `

            </button>
         </td>
      </tr>`;
   });
   
   tableHtml += `</tbody></table></div>`;
   $('#members-list').html(tableHtml);

   // 立即執行過濾程序，以維持目前的選取畫面
   applyMemberFilters();
}

// 6. 整合的雙選單交叉過濾核心函式
function applyMemberFilters() {
   const selectedGroup = $('#group-filter').val() || 'all';
   const selectedCategory = $('#category-filter').val() || 'all';

   $('.member-row').each(function() {
      const rowGroup = $(this).attr('data-group');
      const rowCategory = $(this).attr('data-category');

      // 檢查組別條件 (考慮 'all' 與 'none')
      const groupMatch = (selectedGroup === 'all' || rowGroup === selectedGroup);
      // 檢查類別條件
      const categoryMatch = (selectedCategory === 'all' || rowCategory === selectedCategory);

      // 必須組別與類別同時符合，才顯示該列
      if (groupMatch && categoryMatch) {
         $(this).show();
      } else {
         $(this).hide();
      }
   });
}

function initFormSelects() {
   // 渲染【性別】下拉選單 (保留原本 HTML 寫好的第一個預設提示 option)
   genderMap.forEach((text, value) => {
       $('#m-gender').append(`<option value="${value}">${text}</option>`);
   });

   // 渲染【會員類別】下拉選單 (此選單無提示，直接用 .html() 覆寫)
   let categoryHtml = '';
   categoryMap.forEach((text, value) => {
       categoryHtml += `<option value="${value}">${text}</option>`;
   });
   $('#m-category').html(categoryHtml);

   // 渲染【所屬組別】下拉選單 (保留原本的請選擇提示)
   groupMap.forEach((text, value) => {
       $('#m-group_number').append(`<option value="${value}">${text}</option>`);
   });
}

// 4. jQuery 事件監聽器區塊
$(document).ready(function() {
   initFormSelects();
   
   // 當「組別」或「類別」任一選單改變時，立即連動交叉篩選
   $(document).on('change', '#group-filter, #category-filter', function() {
      applyMemberFilters();
   });

   // 監聽點擊表格標頭欄位排序
   $(document).on('click', '.sort-th', function() {
      const clickedKey = $(this).data('key');
      
      if (currentSort.key === clickedKey) {
         currentSort.asc = !currentSort.asc;
      } else {
         currentSort.key = clickedKey;
         currentSort.asc = true;
      }
      loadMembers();
   });
   
   // 編輯按鈕點擊事件 (從元素 data 屬性傳遞資料)

        const saveBtn = document.getElementById('save-attendance-btn');

        if (!activityId) {
            container.innerHTML = '<p class="text-muted text-center py-5">請先於上方選擇一項活動以載入簽到名單。</p>';
            saveBtn.disabled = true;
            return;
        }

        container.innerHTML = '<div class="text-center p-5"><div class="spinner-border text-danger"></div><p class="mt-2 text-muted">正在對接會員庫與關聯表...</p></div>';

        try {
            // 1. 同步抓取全體會員
            const { data: members, error: mErr } = await _supabase.from('members').select('id, name, group_number, category').order('name');
            if (mErr) throw mErr;

            // 2. 抓取這場活動現有的出席紀錄
            const { data: attendanceRecords, error: aErr } = await _supabase.from('attendance').select('member_id, status, notes').eq('activity_id', activityId);
            if (aErr) throw aErr;

            // 將現有紀錄轉為 Map 結構方便比對
            const recordMap = new Map();
            attendanceRecords.forEach(r => recordMap.set(r.member_id, { status: r.status, notes: r.notes || '' }));

            // 3. 渲染點名 UI 表格
            let html = `
                <div class="table-responsive">
                    <table class="table table-bordered table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 15%">會員姓名</th>
                                <th style="width: 15%">組別 / 身份</th>
                                <th style="width: 45%">出席狀態登記</th>
                                <th style="width: 25%">備註說明</th>
                            </tr>
                        </thead>
                        <tbody>`;

            members.forEach(m => {
                const existing = recordMap.get(m.id) || { status: 'NotRegistered', notes: '' };
                const currentStatus = existing.status; // 'Registered', 'Attended', 'Absent' 或 自訂 'NotRegistered'

                html += `
                    <tr class="member-row" data-member-id="${m.id}">
                        <td><strong class="text-dark">${m.name}</strong></td>
                        <td>
                            <span class="badge bg-light text-dark border">${m.group_number ? '第'+m.group_number+'組' : '未編組'}</span>
                        </td>
                        <td>
                            <div class="d-flex gap-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="status-${m.id}" id="status-nr-${m.id}" value="NotRegistered" ${currentStatus === 'NotRegistered' ? 'checked' : ''}>
                                    <label class="form-check-label small text-muted" for="status-nr-${m.id}">未參與</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="status-${m.id}" id="status-reg-${m.id}" value="Registered" ${currentStatus === 'Registered' ? 'checked' : ''}>
                                    <label class="form-check-label small text-primary fw-bold" for="status-reg-${m.id}">已報名</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="status-${m.id}" id="status-att-${m.id}" value="Attended" ${currentStatus === 'Attended' ? 'checked' : ''}>
                                    <label class="form-check-label small text-success fw-bold" for="status-att-${m.id}">已出席</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="status-${m.id}" id="status-abs-${m.id}" value="Absent" ${currentStatus === 'Absent' ? 'checked' : ''}>
                                    <label class="form-check-label small text-danger fw-bold" for="status-abs-${m.id}">請假/缺席</label>
                                </div>
                            </div>
                        </td>
                        <td>
                            <input type="text" id="notes-${m.id}" class="form-control form-control-sm" value="${existing.notes}" placeholder="例：素食、帶眷屬1人">
                        </td>
                    </tr>`;
            });

            html += '</tbody></table></div>';
            container.innerHTML = html;
            saveBtn.disabled = false;

        } catch (err) {
            container.innerHTML = `<div class="alert alert-danger">加載失敗：${err.message}</div>`;
        }
    }

    // 批次儲存點名結果
    async function submitAttendanceSheet() {
        const activityId = document.getElementById('attendance-activity-select').value;
        if (!activityId) return;

        const saveBtn = document.getElementById('save-attendance-btn');
        saveBtn.disabled = true;
        saveBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> 儲存中...';

        const rows = document.querySelectorAll('.member-row');
        const upsertData = [];
        const deleteIds = [];

        rows.forEach(row => {
            const memberId = row.getAttribute('data-member-id');
            const selectedRadio = document.querySelector(`input[name="status-${memberId}"]:checked`);
            const status = selectedRadio ? selectedRadio.value : 'NotRegistered';
            const notes = document.getElementById(`notes-${memberId}`).value.trim();

            if (status === 'NotRegistered') {
                // 如果選擇「未參與」，代表該活動與該會員無關係，記錄存在則刪除
                deleteIds.push(memberId);
            } else {
                // 需要寫入或更新紀錄
                upsertData.push({
                    activity_id: activityId,
                    member_id: memberId,
                    status: status,
                    notes: notes || null
                });
            }
        });

        try {
            // 1. 執行刪除 (改選為未參與的成員)
            if (deleteIds.length > 0) {
                const { error: delErr } = await _supabase
                    .from('attendance')
                    .delete()
                    .eq('activity_id', activityId)
                    .in('member_id', deleteIds);
                if (delErr) throw delErr;
            }

            // 2. 執行 Upsert (有變更狀態的成員，因為設定了複合唯一限制 unique_member_activity，Supabase 會自動判定更新或新增)
            if (upsertData.length > 0) {
                const { error: upErr } = await _supabase
                    .from('attendance')
                    .upsert(upsertData, { onConflict: 'member_id,activity_id' });
                if (upErr) throw upErr;
            }

            alert('🎉 出席簽到點名紀錄已成功更新至雲端資料庫！');
            loadAttendanceSheet(); // 重新整理
        } catch (err) {
            alert('儲存失敗：' + err.message);
        } finally {
            saveBtn.disabled = false;
            saveBtn.innerHTML = '<i class="bi bi-cloud-upload me-1"></i> 儲存本次點名紀錄';
        }
    }
</script>
</body>
</html>
