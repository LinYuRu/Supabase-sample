<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>永和慢跑 - 管理員後台</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container { max-width: 900px; margin-top: 50px; }
        .post-card { border-left: 5px solid #0d6efd; margin-bottom: 15px; }
        #admin-content { display: none; }
    </style>
</head>
<body class="bg-light">

<div class="container">
    <div id="login-section" class="card p-4 shadow-sm mx-auto" style="max-width: 400px;">
        <h3 class="text-center mb-3">管理員登入</h3>
        <input type="email" id="email" class="form-control mb-2" placeholder="管理員 Email">
        <input type="password" id="password" class="form-control mb-3" placeholder="密碼">
        <button onclick="handleLogin()" class="btn btn-primary w-100">進入後台</button>
    </div>

    <div id="admin-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>公告管理後台</h2>
            <button onclick="handleLogout()" class="btn btn-outline-danger btn-sm">登出</button>
        </div>

        <div id="posts-list">
            </div>
    </div>
</div>

<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">編輯公告</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="edit-id">
                <div class="mb-3">
                    <label class="form-label">標題</label>
                    <input type="text" id="edit-title" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">內容</label>
                    <textarea id="edit-text" class="form-control" rows="5"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button onclick="submitUpdate()" class="btn btn-success">儲存修改</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const SUPABASE_URL = 'https://awenxjiniepxbnbxdefl.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_-tvu7CWehM2faugobpRR7w_wVl0tL2g';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let editModal;

    // 1. 初始化
    document.addEventListener('DOMContentLoaded', () => {
        editModal = new bootstrap.Modal(document.getElementById('editModal'));
        checkSession();
    });

    // 2. 登入檢查
    async function checkSession() {
        const { data: { session } } = await _supabase.auth.getSession();
        if (session) {
            showAdmin();
        }
    }

    async function handleLogin() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const { error } = await _supabase.auth.signInWithPassword({ email, password });
        if (error) alert("登入失敗: " + error.message);
        else showAdmin();
    }

    function showAdmin() {
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('admin-content').style.display = 'block';
        loadPosts();
    }

    // 3. 讀取公告清單
    async function loadPosts() {
        const { data, error } = await _supabase.from('posts').select('*').order('id', { ascending: true });
        const listDiv = document.getElementById('posts-list');
        listDiv.innerHTML = '';
        
        data.forEach(post => {
            listDiv.innerHTML += `
                <div class="card post-card shadow-sm p-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">${post.title}</h5>
                        <button class="btn btn-warning btn-sm" onclick="openEditModal(${post.id}, '${post.title}', \`${post.content}\`)">編輯</button>
                    </div>
                </div>
            `;
        });
    }

    // 4. 開啟編輯視窗
    function openEditModal(id, title, content) {
        document.getElementById('edit-id').value = id;
        document.getElementById('edit-title').value = title;
        document.getElementById('edit-text').value = content;
        editModal.show();
    }

    // 5. 送出修改至 Supabase
    async function submitUpdate() {
        const id = document.getElementById('edit-id').value;
        const title = document.getElementById('edit-title').value;
        const content = document.getElementById('edit-text').value;

        const { error } = await _supabase
            .from('posts')
            .update({ title, content })
            .eq('id', id);

        if (error) {
            alert("修改失敗！可能是 Email 不符合管理員權限。\n錯誤訊息：" + error.message);
        } else {
            alert("修改成功！");
            editModal.hide();
            loadPosts();
        }
    }

    async function handleLogout() {
        await _supabase.auth.signOut();
        location.reload();
    }

    // 1. 管理員登入邏輯
async function adminLogin(email, password) {
    const { data, error } = await _supabase.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (error) {
        console.error("登入失敗:", error.message);
    } else {
        console.log("管理員已登入:", data.user.email);
    }
}

// 2. 修改特定公告的內容 (只有當登入者的 Email 符合 RLS 規則時才會成功)
async function updatePostContent(postId, newContent) {
    const { data, error } = await _supabase
        .from('posts')
        .update({ content: newContent })
        .eq('id', postId); // 指定要修改的文章 ID

    if (error) {
        // 如果 Email 不符合 RLS 規則，這裡會回傳錯誤
        alert("修改失敗：您可能沒有管理員權限。內容：" + error.message);
    } else {
        alert("公告修改成功！");
    }
}
</script>
</body>
</html>
